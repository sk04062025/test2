upstream backstage {
    # 'host.docker.internal' resolves to the host machine's IP from inside Docker
    server host.docker.internal:7007; 
}

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name your-backstage-domain.com; # <--- REPLACE WITH YOUR DNS

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Handle HTTPS traffic
server {
    listen 443 ssl;
    server_name your-backstage-domain.com; # <--- REPLACE WITH YOUR DNS

    # SSL Config - These files must exist in the ./certs folder
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;

    # Basic SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Log files (optional, helpful for debugging)
    access_log /var/log/nginx/backstage_access.log;
    error_log /var/log/nginx/backstage_error.log;

    location / {
        proxy_pass http://backstage;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Crucial for Keycloak/OIDC to know the original request was HTTPS
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket support (Required for some Backstage features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
